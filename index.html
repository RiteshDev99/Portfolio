<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritesh Chaudhary</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <link rel="icon" href="/assets/icons/me.jpg" />
      <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#0A0A0B',
              secondary: '#111113',
              surface: '#18181B',
              primary: '#6366F1', // Indigo 500
              accent: '#8B5CF6',  // Violet 500
              pink: '#EC4899',
              border: '#27272A',
              text: {
                primary: '#FAFAFA',
                secondary: '#A1A1AA'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'marquee': 'marquee 25s linear infinite',
              'gradient-slow': 'gradient 15s ease infinite',
              'slide-down': 'slideDown 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pop': 'pop 400ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              gradient: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              slideDown: {
                '0%': { opacity: 0, transform: 'translateY(-8px) scale(0.995)' },
                '100%': { opacity: 1, transform: 'translateY(0) scale(1)' }
              },
              pop: {
                '0%': { opacity: 0, transform: 'scale(0.95)' },
                '100%': { opacity: 1, transform: 'scale(1)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0A0A0B;
        color: #FAFAFA;
        overflow-x: hidden;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0A0B;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272A;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6366F1;
      }

      /* Glass utilities */
      .glass {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .glass-card {
        background: linear-gradient(180deg, rgba(24, 24, 27, 0.4) 0%, rgba(24, 24, 27, 0.8) 100%);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .text-gradient {
        background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Noise Texture */
      .noise-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Fallback utility for slide-down animation in case Tailwind CDN tree-shakes it */
      .animate-slide-down {
        animation: slideDown 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Fallback pop animation for CTAs */
      .animate-pop {
        animation: pop 420ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes pop {
        0% { opacity: 0; transform: translateY(6px) scale(0.98); }
        60% { opacity: 1; transform: translateY(-4px) scale(1.03); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes slideDown {
        0% { opacity: 0; transform: translateY(-8px) scale(0.995); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Small visual tweaks for mobile to reduce heavy blurs */
      @media (max-width: 768px) {
        .blur-3xl { filter: blur(24px); }
        .blur-2xl { filter: blur(18px); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <div class="noise-bg"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
